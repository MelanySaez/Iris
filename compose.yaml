# Local development services. Run with `docker compose` or `podman compose`
# from the repository root; both read variables from `.env` (see `.env.example`).
services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iris}
      POSTGRES_DB: ${POSTGRES_DB:-iris}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - iris-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iris-pgdata:
