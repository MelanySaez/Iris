# Local development services. Run with `docker compose` from the repository root.
services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - iris-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  iris-pgdata:
